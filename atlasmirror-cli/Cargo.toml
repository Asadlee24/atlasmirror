[package]
name = "atlasmirror-cli"
version = "0.1.0"
edition = "2021"
authors = ["AtlasMirror Contributors"]
license = "MIT OR Apache-2.0"
description = "Command-line interface for the AtlasMirror decentralized OpenStreetMap distribution system"

[dependencies]
osm-registry-core = { path = "../osm-registry/registry_core" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
indicatif = "0.17"
colored = "2.1"
thiserror = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
