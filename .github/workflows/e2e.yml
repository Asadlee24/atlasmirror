name: E2E Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_real_integration:
        description: "Execute real integration with live logoscore & LEZ"
        required: true
        type: boolean
        default: false

jobs:
  unit-verification:
    name: Unit & Contract Model Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Unit Tests
        run: |
          python tests/unit/validate_catalog.py
          python tests/unit/test_geofabrik.py
          python tests/unit/test_checksum.py
          python tests/unit/test_storage_mock.py
          python tests/unit/test_registry_model.py

  real-e2e-integration:
    name: Real Infrastructure Integration (logoscore & LEZ)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_real_integration == 'true' }}
    needs: unit-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Real E2E Test (Fails if Logos daemons absent)
        run: |
          chmod +x scripts/*.sh
          python tests/integration/test_e2e_real.py
