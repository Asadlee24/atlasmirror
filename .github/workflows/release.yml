name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-modules:
    name: Package & Publish Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - name: Build Modules
        run: |
          nix build .#atlasmirror-sdk
          nix build .#atlasmirror-app
      - name: Package Release Bundles
        run: |
          mkdir -p dist
          tar -czf dist/atlasmirror-cli-linux-amd64.tar.gz -C target/release atlasmirror-cli 2>/dev/null || true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
