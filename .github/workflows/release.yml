name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-modules:
    name: Package & Publish Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake qt6-base-dev qt6-declarative-dev libgl1-mesa-dev python3
      - name: Build CLI
        run: |
          cd atlasmirror-cli
          cargo build --release
      - name: Build SDK
        run: |
          cmake -S atlasmirror-sdk -B atlasmirror-sdk/build -DCMAKE_BUILD_TYPE=Release
          cmake --build atlasmirror-sdk/build --config Release
      - name: Build App Backend
        run: |
          cmake -S atlasmirror-app -B atlasmirror-app/build -DCMAKE_BUILD_TYPE=Release
          cmake --build atlasmirror-app/build --config Release
      - name: Package Basecamp App .lgx (v0.1.1)
        run: |
          python3 scripts/package_app_lgx.py
      - name: Package Release Bundles
        run: |
          mkdir -p dist
          tar -czf dist/atlasmirror-cli-linux-x86_64.tar.gz -C atlasmirror-cli/target/release atlasmirror-cli
          tar -czf dist/atlasmirror-sdk-headers.tar.gz -C atlasmirror-sdk/include .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
