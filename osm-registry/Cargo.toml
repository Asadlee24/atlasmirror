[workspace]
resolver = "2"
members = [
    "registry_core",
    "methods/guest",
    "examples",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AtlasMirror Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Asadlee24/atlasmirror"

[workspace.dependencies]
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.0", features = ["full"] }
