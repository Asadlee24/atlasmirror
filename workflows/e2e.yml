name: E2E Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-local-sequencer:
    name: End-to-End Test (Local LEZ Sequencer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run E2E Demo Script
        run: |
          chmod +x scripts/*.sh
          bash scripts/demo.sh --ci
